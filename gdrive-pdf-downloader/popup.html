<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .header img {
      width: 28px;
      height: 28px;
    }
    #status {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
      color: #a0a0a0;
    }
    #status.success {
      color: #4ecca3;
    }
    #status.error {
      color: #e74c3c;
    }
    #status.working {
      color: #f0c040;
    }
    #progress-container {
      display: none;
      margin-bottom: 14px;
    }
    #progress-bar-bg {
      background: #16213e;
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
    }
    #progress-bar {
      background: linear-gradient(90deg, #4ecca3, #3ab795);
      height: 100%;
      width: 0%;
      border-radius: 6px;
      transition: width 0.3s ease;
    }
    #progress-text {
      text-align: right;
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    #downloadBtn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #4ecca3, #3ab795);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #downloadBtn:hover {
      opacity: 0.9;
    }
    #downloadBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .note {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GDrive PDF Downloader</h1>
  </div>

  <div id="status">Open a Google Drive document to download it as PDF.</div>

  <div id="progress-container">
    <div id="progress-bar-bg">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">0%</div>
  </div>

  <button id="downloadBtn">Download PDF</button>

  <div class="note">Works with read-only Google Drive documents</div>

  <script src="popup.js"></script>
</body>
</html>
